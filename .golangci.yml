version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gomodguard
    - exhaustive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      severity: medium
      confidence: medium
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unused
      # pkg/accept is a deliberate v2.5 deprecation facade (removed in v3.0).
      # Consumers intentionally keep importing it for backward compatibility.
      - path: pkg/gate/pipeline\.go|pkg/enrich/cli/cli\.go|cmd/art14/art14\.go|pkg/accept/cli/cli_handlers\.go|pkg/orchestrator/gate\.go|cmd/evaluate/evaluate_active_exploit_test\.go|test/security/crypto_audit_test\.go
        linters:
          - staticcheck
        text: "is deprecated"
      - path: research/
        linters:
          - errcheck
          - gosec
          - unused
          - staticcheck
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprint` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprintf` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprintln` is not checked"
      - linters:
          - staticcheck
        text: "QF1003"
      - linters:
          - errcheck
        source: "\\s+_\\s+:="
      - linters:
          - errcheck
        source: "\\s+_\\s+="
      - linters:
          - errcheck
        text: "Error return value is not checked"
        source: "\\.\\(ed25519\\.PublicKey\\)"
