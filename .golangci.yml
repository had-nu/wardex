version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - gomodguard_v2
    - exhaustive
    - funlen
    - forbidigo
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      severity: medium
      confidence: medium
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 60
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
        - pattern: '^os\.Exit$'
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unused
          - forbidigo
      # A command's main is the one place that must turn a result into a
      # process exit status. Library code and run functions stay covered.
      - path: (^|/)main\.go$
        linters:
          - forbidigo
      # pkg/accept is a deliberate v2.5 deprecation facade (removed in v3.0).
      # Consumers intentionally keep importing it for backward compatibility.
      - path: pkg/gate/pipeline\.go|pkg/enrich/cli/cli\.go|cmd/art14/art14\.go|pkg/accept/cli/cli_handlers\.go|pkg/orchestrator/gate\.go|cmd/evaluate/evaluate_active_exploit_test\.go|test/security/crypto_audit_test\.go
        linters:
          - staticcheck
        text: "is deprecated"
      # research/ is local, git-ignored scratch space, not a repository
      # directory. The exclusion stays so a developer's experiments do not
      # fail the repository lint; it is not masking tracked code.
      - path: research/
        linters:
          - errcheck
          - gosec
          - unused
          - staticcheck
      - linters:
          - staticcheck
        text: "QF1003"
      - linters:
          - errcheck
        text: "Error return value is not checked"
        source: "\\.\\(ed25519\\.PublicKey\\)"

issues:
  # The repository-wide baseline for the lint ratchet: existing issues are
  # tolerated, issues introduced after the last pre-modularisation release are
  # not. When baseline/modular-0 exists, this is the revision it records.
  new-from-rev: v2.7.0-rc.1
