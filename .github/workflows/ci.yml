name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go fix is clean
        run: |
          go fix ./...
          git diff --exit-code || (echo "go fix produced changes. Run 'go fix ./...' locally." && exit 1)

      - name: Run vet (includes stdversion)
        run: go vet ./...

      - name: Run tests & Generate Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage HTML report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artefacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html

      - name: Enforce Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "Current Test Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 40.0" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below the required 40.0% threshold."
            echo "Tip: Low-coverage packages include pkg/accept/cli (13.3%) and pkg/accept (19.8%). Run 'go test -coverprofile=out ./... && go tool cover -func=out | sort -k3' to see per-package breakdown."
            exit 1
          fi

  reproducible:
    name: Reproducible Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Verify the release build is byte-for-byte reproducible
        run: go run ./tools/verify-reproducible -n 2 -version 0.0.0-ci

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: v2.15.0
          # The published binaries are built with an older Go and cannot read
          # the export data of the toolchain this job installs. Building from
          # source pins the linter to the same Go as the code it analyses.
          install-mode: goinstall

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install govulncheck
        # Pinned by revision rather than tag, so the scanner cannot change
        # between two runs of the same commit. This is reproducibility of the
        # build chain, not integrity: govulncheck does not attest to the
        # artefacts it scans. Integrity against the audited operator comes from
        # external custody, not from anything pinned here.
        run: go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Install gosec
        # v2.29.0, the newest release, cannot read the export data of Go 1.27.2:
        # it skips SSA analysis for every package and still exits non-zero. The
        # fix is on master and has no release yet, so pin the exact revision
        # rather than a branch name. Revisit when a release catches up.
        run: go install github.com/securego/gosec/v2/cmd/gosec@707f2271f66579a18e1da25794b1e8012247274b

      - name: Run gosec
        run: gosec -exclude-dir=research ./...
