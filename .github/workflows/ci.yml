name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go fix is clean
        run: |
          go fix ./...
          git diff --exit-code || (echo "go fix produced changes. Run 'go fix ./...' locally." && exit 1)

      - name: Run vet (includes stdversion)
        run: go vet ./...

      - name: Verify module boundaries
        # Runs with and without the grpc build tag; the tool checks both.
        run: make boundaries

      - name: Run tests & Generate Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage HTML report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artefacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html

      - name: Verify documentation links resolve
        run: go run ./tools/check-doclinks

      - name: Verify specification structure and vocabulary
        run: go run ./tools/check-specs

      - name: Enforce Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "Current Test Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 40.0" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below the required 40.0% threshold."
            echo "Tip: Low-coverage packages include pkg/accept/cli (13.3%) and pkg/accept (19.8%). Run 'go test -coverprofile=out ./... && go tool cover -func=out | sort -k3' to see per-package breakdown."
            exit 1
          fi

  reproducible:
    name: Reproducible Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Verify the release build is byte-for-byte reproducible
        run: go run ./tools/verify-reproducible -n 2 -version 0.0.0-ci

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: v2.15.0
          # The published binaries are built with an older Go and cannot read
          # the export data of the toolchain this job installs. Building from
          # source pins the linter to the same Go as the code it analyses.
          install-mode: goinstall

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install govulncheck
        # Pinned by revision rather than tag, so the scanner cannot change
        # between two runs of the same commit. This is reproducibility of the
        # build chain, not integrity: govulncheck does not attest to the
        # artefacts it scans. Integrity against the audited operator comes from
        # external custody, not from anything pinned here.
        run: go install golang.org/x/vuln/cmd/govulncheck@19b0bb6a272792b9afa8a6983c3e9b9a1816947f

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Install gosec
        # v2.29.0, the newest release, cannot read the export data of Go 1.27.2:
        # it skips SSA analysis for every package and still exits non-zero. The
        # fix is on master and has no release yet, so pin the exact revision
        # rather than a branch name. Revisit when a release catches up.
        run: go install github.com/securego/gosec/v2/cmd/gosec@707f2271f66579a18e1da25794b1e8012247274b

      - name: Run gosec
        run: gosec -exclude-dir=research ./...

  attribution:
    name: Attribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The check reads commit messages across a range, so it needs the
          # history and not only the tip. On a pull request this also brings the
          # base branch, which is where the range starts.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"

      - name: Determine the range to inspect
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            # The all-zero SHA of a first push names no parent to exclude, so
            # inspect that single commit instead of an unresolvable range.
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi
            echo "base=$before" >> "$GITHUB_OUTPUT"
          fi
          echo "tip=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Report trailers that name an AI assistant
        # Exits 1 when a commit in the range carries such a trailer, 2 when the
        # check itself could not run. The two are kept distinct so that a
        # history the runner cannot read never reads as a pass.
        run: |
          go run ./tools/check-attribution \
            -base "${{ steps.range.outputs.base }}" \
            -tip "${{ steps.range.outputs.tip }}"

  golden:
    name: Golden
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The trailer check reads the commits in the range, not only the tip.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Run the golden harness
        # Every case runs twice and the two results must match before the
        # committed want/ is compared.
        run: make golden

      - name: Determine the range to inspect
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before=""
            fi
            echo "base=$before" >> "$GITHUB_OUTPUT"
          fi
          echo "tip=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Require a Golden-Change trailer when want/ changes
        # Exits 1 when the range rewrites a golden expectation without a
        # recorded reason, 2 when the check itself could not run.
        run: |
          go run ./tools/check-golden \
            -base "${{ steps.range.outputs.base }}" \
            -tip "${{ steps.range.outputs.tip }}"
