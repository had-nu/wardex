name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Install syft
        env:
          SYFT_VERSION: "1.19.0"
          SYFT_SHA256: "1dec148ea36aef68a866e35528974b5dbc106ba0b545f1a262ad977d48294637"
        run: |
          curl -sSfL \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            -o syft.tar.gz
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz syft
          install -m 0755 syft /usr/local/bin/syft
          rm syft.tar.gz syft

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate native SBOM
        run:           go run ./tools/gen-sbom/ wardex-${{ github.ref_name }}.sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: wardex-*.sbom.json

  attest:
    name: Attest Build Provenance
    runs-on: ubuntu-latest
    # Attestations describe the artefacts the release job produced, so it must
    # run after it. Permissions are per-job on purpose: the release job keeps
    # its own set and does not inherit write access to attestations.
    needs: goreleaser
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Each job gets a clean runner, so the dist/ directory the release job
      # built does not exist here. Fetch the artefacts from the published
      # release instead. That is also the stronger property: the attestation
      # then describes the bytes a user downloads, not a local rebuild of them.
      - name: Download the published artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --pattern '*.tar.gz' \
            --pattern '*.sbom.json' \
            --pattern '*.sig' \
            --dir dist
          # Fail here with a clear message rather than letting the attestation
          # step report a missing glob, which says nothing about its cause.
          count=$(find dist -type f | wc -l)
          echo "downloaded ${count} artefact(s)"
          if [ "${count}" -eq 0 ]; then
            echo "::error::No artefacts found for ${{ github.ref_name }}; the attestation would cover nothing."
            exit 1
          fi

      # Uses the built-in GitHub attestation service rather than
      # slsa-github-generator, which its own maintainers have marked as no
      # longer actively maintained in favour of this mechanism. The predicate
      # still carries the SLSA build provenance shape.
      - name: Attest release artefacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sbom.json
            dist/*.sig
