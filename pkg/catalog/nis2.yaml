      name: "Measure whether the measures work, rather than asserting that they exist"
      min_maturity: 3
      gate_relevant: false
    - id: PR.NIS2.21.2.f.2
      name: "Compare effectiveness between runs so a regression is visible rather than inferred"
      min_maturity: 4
      gate_relevant: false
    - id: PR.NIS2.21.2.f.3
      name: "Feed the measurement back into the risk analysis the measures came from"
      min_maturity: 4
      gate_relevant: false

