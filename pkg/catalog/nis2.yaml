# --- Article 23: Reporting obligations -----------------------------------------

- id: NIS2.23.1
  name: "Art. 23(1) — Notify a significant incident to the CSIRT without undue delay, and the recipients where appropriate"
  domain: "process"
  base_score: 9.5
  keywords:
    - significant incident
    - notification
    - csirt
    - reportable
  practices:
    - id: PR.NIS2.23.1.1
      name: "Define which incidents are significant and record the decision either way"
      min_maturity: 3
      gate_relevant: false
    - id: PR.NIS2.23.1.2
      name: "Report anything enabling a cross-border impact to be determined"
      min_maturity: 3
      gate_relevant: false

- id: NIS2.23.4
  name: "Art. 23(4) — Staged notification: 24 hours, 72 hours and one month"
  domain: "process"
  base_score: 9.5
  keywords:
    - early warning
    - 24 hours
    - 72 hours
    - final report
  practices:
    - id: PR.NIS2.23.4.1
      name: "Send an early warning within 24 hours of awareness, stating suspicion of unlawful or malicious acts and any cross-border impact"
      min_maturity: 3
      gate_relevant: false
    - id: PR.NIS2.23.4.2
      name: "Send the incident notification within 72 hours with an initial severity and impact assessment"
      min_maturity: 3
      gate_relevant: false
    - id: PR.NIS2.23.4.3
      name: "Submit the final report within one month of the incident notification, or on request after the incident"
      min_maturity: 3
      gate_relevant: false

