# NIS2 control catalogue.
#
# Sources:
#   - Directive (EU) 2022/2555 of the European Parliament and of the Council of
#     14 December 2022, OJ L 333, 27.12.2022, CELEX 32022L2555.
#   - Commission Guidelines on the application of Article 4(1) and (2), C(2023)
#     6068 final, 13.9.2023, for the size thresholds that decide who is in scope.
#   - Commission Guidelines on the application of Article 3(4), C(2023) 6070
#     final, 13.9.2023, for the distinction between an important entity
#     providing public services and any other important entity.
#
# Identifier scheme. Two namespaces, and the distinction is not cosmetic:
#
#   NIS2.<article>[.<paragraph>].<letter>
#       An obligation of the Directive, quoted in substance from the article it
#       belongs to. Article 21(2) has exactly ten lettered items, (a) to (j).
#
#   NIS2.SUP.<letter>
#       A measure that supports one of those items but is not itself a lettered
#       item. Most are ISO/IEC 27001:2022 Annex A controls, and the Annex A
#       reference is given in the control name. These are listed separately so
#       that no identifier claims a legal provenance it does not have.
#
# This split is deliberate. An earlier version of this file numbered twenty-five
# controls as Article 21(2)(a) through (y). The Directive lists ten. Fifteen of
# those identifiers corresponded to nothing in the Directive, four more carried
# the wrong letter, and the obligation to assess the effectiveness of the
# measures was absent altogether — which is the obligation this tool most
# directly supports, and the one a reader would most expect to find.

# --- Article 20: Governance ---------------------------------------------------

- id: NIS2.20.1
  name: "Art. 20(1) — Management body approves and supervises risk-management measures"
  domain: "organizational"
  base_score: 9.0
  keywords:
    - governance
    - accountability
    - management body
  practices:
    - id: PR.NIS2.20.1.1
      name: "Record the approval of the risk-management measures by the management body, not only their existence"
      min_maturity: 3
      gate_relevant: false
    - id: PR.NIS2.20.1.2
      name: "Track which duties the management body may delegate and which it may not; execution may be delegated, responsibility may not"
      min_maturity: 3
      gate_relevant: false

- id: NIS2.20.2
  name: "Art. 20(2) — Training of the management body"
  domain: "people"
  base_score: 8.0
  keywords:
    - training
    - management body
  practices:
    - id: PR.NIS2.20.2.1
      name: "Train the management body on its obligations and on the risks specific to the entity"
      min_maturity: 3
      gate_relevant: false

