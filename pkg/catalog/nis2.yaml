- id: NIS2.21.2.f
  name: "Art. 21(2)(f) — Policies and procedures to assess the effectiveness of the risk-management measures"
  domain: "process"
  base_score: 9.5
  keywords:
    - effectiveness
    - metrics
    - measurement
    - continuous improvement
  practices:
