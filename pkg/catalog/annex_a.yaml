# ISO/IEC 27001:2022 Annex A control catalogue.
#
# Source:
#   - ISO/IEC 27001:2022, Annex A, the 93 controls of the 2022 statement of
#     applicability.
#   - ISO/IEC 27002:2022, third edition, 2022-02, reference number
#     ISO/IEC 27002:2022(E), "Information security, cybersecurity and privacy
#     protection — Information security controls". Every control name below is
#     the title given in that standard. The reference is retained here because
#     Wardex does not reproduce the standard; the titles are identifiers, not
#     quotations of its text.
#
# The 93 titles were extracted from the standard and matched against the
# identifiers this file already carried. Every identifier matched, so the
# numbering was right and only the names were placeholders: 88 of them read
# "Control A.x.y". An earlier version of this file therefore could not tell a
# reader what any control meant, and two files in the repository used different
# wording for the same control.
#
# Fields other than the name are Wardex's own and are deliberately not taken
# from the standard. `keywords` in particular is the vocabulary the correlator
# matches against operator-supplied evidence, so its wording is a product
# decision and not a quotation.
#
# Domains follow the four chapters of the standard: 5 organizational, 6 people,
# 7 physical, 8 technological.

