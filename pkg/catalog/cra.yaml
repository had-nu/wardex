# Cyber Resilience Act control catalogue.
#
# Source:
#   - Regulation (EU) 2024/2847 of the European Parliament and of the Council of
#     23 October 2024 on horizontal cybersecurity requirements for products with
#     digital elements, OJ L, 20.11.2024, ELI
#     http://data.europa.eu/eli/reg/2024/2847/oj.
#     Article numbers, titles and every requirement quoted here were read from
#     that text. Application dates are in Article 71: the Regulation applies from
#     11 December 2027, with Article 14 reporting obligations from 11 September
#     2026.
#
# Who this applies to. Wardex helps a manufacturer produce the evidence. It is not
# a manufacturer, and most of the obligations below are not Wardex's. Annex VII
# and Article 28 are the manufacturer's to produce; what Wardex can do is assemble
# the inputs and check that what exists is consistent.
#
# Identifier scheme:
#   CRA.Art13.<n>          an obligation of an article, by paragraph
#   CRA.AnnexI.1.<n>      a requirement of Annex I Part I
#   CRA.AnnexI.2.<n>      a vulnerability handling requirement of Annex I Part II
#   CRA.AnnexVII.<n>      a field of the technical documentation
#   CRA.SUP.<x>           a supporting measure that is not itself a requirement,
#                         named by what it supports
#
# Scope note. This file covers the obligations a manufacturer of a product with
# digital elements can evidence with tooling. Economic operator duties that
# belong to importers, distributors and authorised representatives (Articles 18
# to 22) are not listed: they apply to different actors and putting them in a
# manufacturer's catalogue invites a reader to score the wrong party. Article 71
# and Annex III carry dates and are recorded on CRA.SUP rather than as controls,
# because a date is an applicability test rather than a measure.

# --- Article 13: Obligations of manufacturers ---------------------------------

- id: CRA.Art13.1
  name: "Art. 13(1) — Design, development and production in accordance with Annex I Part I"
  domain: "technological"
  base_score: 9.5
  keywords:
    - essential requirements
    - annex i
    - secure by design
  practices:
    - id: PR.CRA.Art13.1.1
      name: "Trace each product to the Annex I Part I requirements it claims and to the evidence for each"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art13.2
  name: "Art. 13(2) and (3) — Cybersecurity risk assessment, documented and kept current"
  domain: "process"
  base_score: 9.5
  keywords:
    - risk assessment
    - threat model
    - documented
  practices:
    - id: PR.CRA.Art13.2.1
      name: "Assess risk on the intended purpose and reasonably foreseeable use, including the operational environment and the assets to protect"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.2.2
      name: "State whether the Annex I Part I point (2) requirements apply and how each is implemented"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.2.3
      name: "Take the assessment into account during planning, design, development, production, delivery and maintenance"
      min_maturity: 4
      gate_relevant: false
    - id: PR.CRA.Art13.2.4
      name: "Update the assessment during the support period, not only at release"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art13.4
  name: "Art. 13(4) — Risk assessment in the technical documentation, with justification for what does not apply"
  domain: "process"
  base_score: 9.0
  keywords:
    - annex vii
    - technical documentation
    - justification
  practices:
    - id: PR.CRA.Art13.4.1
      name: "Include the risk assessment in the Article 31 and Annex VII technical documentation"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.4.2
      name: "Where a requirement does not apply, record a clear justification rather than omitting it"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art13.5
  name: "Art. 13(5) — Due diligence on third-party components"
  domain: "organizational"
  base_score: 9.0
  keywords:
    - third party
    - component
    - open source
    - due diligence
  practices:
    - id: PR.CRA.Art13.5.1
      name: "Assess integrated components, including open-source components not placed on the market commercially"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art13.6
  name: "Art. 13(6) — Report a component vulnerability upstream and remediate in accordance with Annex I Part II"
  domain: "process"
  base_score: 9.0
  keywords:
    - component vulnerability
    - upstream
    - remediation
  practices:
    - id: PR.CRA.Art13.6.1
      name: "Report a vulnerability found in a component to whoever manufactures or maintains it"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.6.2
      name: "Where a fix was written locally, share the code or documentation upstream in a machine-readable format where appropriate"
      min_maturity: 4
      gate_relevant: false

- id: CRA.Art13.7
  name: "Art. 13(7) — Systematically document relevant cybersecurity aspects, proportionately"
  domain: "process"
  base_score: 8.5
  keywords:
    - documentation
    - proportionality
    - third party information
  practices:
    - id: PR.CRA.Art13.7.1
      name: "Record vulnerabilities the manufacturer becomes aware of and relevant information from third parties"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art13.8
  name: "Art. 13(8) — Support period: at least five years, or the expected use time where shorter"
  domain: "governance"
  base_score: 9.5
  keywords:
    - support period
    - lifetime
    - five years
  practices:
    - id: PR.CRA.Art13.8.1
      name: "Determine the support period to reflect expected use, taking account of reasonable user expectations, the nature of the product and Union law on product lifetime"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.8.2
      name: "Set the support period to at least five years, except where the product is expected to be in use for less than five years"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.8.3
      name: "Consider support periods of comparable products, availability of the operating environment, component support periods and ADCO or Commission guidance"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art13.8.4
      name: "Keep the support period under review; delegated acts may raise the minimum for specific product categories"
      min_maturity: 4
      gate_relevant: false
    - id: PR.CRA.Art13.8.5
      name: "Ensure vulnerabilities are handled effectively for the whole support period, not only until launch"
      min_maturity: 3
      gate_relevant: true

- id: CRA.Art14.1
  name: "Art. 14(1) and (2) — Report actively exploited vulnerabilities and severe incidents"
  domain: "process"
  base_score: 9.5
  keywords:
    - actively exploited
    - early warning
    - single reporting platform
    - 24 hours
  practices:
    - id: PR.CRA.Art14.1.1
      name: "Send an early warning within 24 hours of becoming aware, through the single reporting platform"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art14.1.2
      name: "Follow with an incident notification and, unless already provided, a final report"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art28.1
  name: "Art. 28(1) — EU declaration of conformity"
  domain: "governance"
  base_score: 9.5
  keywords:
    - declaration of conformity
    - art 28
    - ce marking
  practices:
    - id: PR.CRA.Art28.1.1
      name: "State that fulfilment of the applicable Annex I essential requirements has been demonstrated"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art28.1.2
      name: "Keep the declaration and the technical documentation consistent with what is actually shipped"
      min_maturity: 3
      gate_relevant: false

- id: CRA.Art28.2
  name: "Art. 28(2) — Structure per Annex V, in the languages the Member State requires"
  domain: "governance"
  base_score: 9.0
  keywords:
    - annex v
    - model structure
    - translation
  practices:
    - id: PR.CRA.Art28.2.1
      name: "Follow the Annex V model structure rather than a house format"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.Art28.2.2
      name: "Update the declaration as appropriate, and make it available in the language the Member State requires"
      min_maturity: 3
      gate_relevant: false

# --- Annex V: the EU declaration of conformity, field by field -----------------
# Article 28(1) and (2) require this structure. A field that is missing is not a
# formatting defect; it is an incomplete declaration.

- id: CRA.AnnexV.1
  name: "Annex V (1) — Name, type and any information allowing unique identification of the product"
  domain: "governance"
  base_score: 8.5
  keywords:
    - identification
    - type designation
  practices:
    - id: PR.CRA.AnnexV.1.1
      name: "Identify the product uniquely enough that it can be told apart from every other product of the same type"
      min_maturity: 2
      gate_relevant: false

- id: CRA.AnnexV.2
  name: "Annex V (2) — Name and address of the manufacturer or its authorised representative"
  domain: "governance"
  base_score: 8.5
  keywords:
    - manufacturer
    - authorised representative
  practices:
    - id: PR.CRA.AnnexV.2.1
      name: "Name the party legally responsible, which is the authorised representative where one is used"
      min_maturity: 2
      gate_relevant: false

- id: CRA.AnnexV.3
  name: "Annex V (3) — Statement that the declaration is issued under the sole responsibility of the provider"
  domain: "governance"
  base_score: 8.5
  keywords:
    - sole responsibility
    - provider
  practices:
    - id: PR.CRA.AnnexV.3.1
      name: "Carry the sole-responsibility statement verbatim, since its wording is prescribed"
      min_maturity: 2
      gate_relevant: false

- id: CRA.AnnexV.4
  name: "Annex V (4) — Object of the declaration, identified for traceability"
  domain: "governance"
  base_score: 8.5
  keywords:
    - traceability
    - identification
  practices:
    - id: PR.CRA.AnnexV.4.1
      name: "Identify the declared product so that it can be traced to a serial, a version or an equivalent"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexV.5
  name: "Annex V (5) — Statement of conformity with the relevant Union harmonisation legislation"
  domain: "governance"
  base_score: 9.0
  keywords:
    - conformity statement
    - harmonisation legislation
  practices:
    - id: PR.CRA.AnnexV.5.1
      name: "Reference this Regulation as the harmonisation legislation the declaration is made under"
      min_maturity: 2
      gate_relevant: false

- id: CRA.AnnexV.6
  name: "Annex V (6) — Harmonised standards, common specifications or certification relied on"
  domain: "governance"
  base_score: 8.5
  keywords:
    - harmonised standards
    - common specification
    - certification
  practices:
    - id: PR.CRA.AnnexV.6.1
      name: "List what conformity is declared against, so a verifier knows which claims rest on a presumption and which do not"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexV.7
  name: "Annex V (7) — Where applicable, the notified body, the procedure performed and the certificate"
  domain: "governance"
  base_score: 9.0
  keywords:
    - notified body
    - eu-type examination
    - certificate
  practices:
    - id: PR.CRA.AnnexV.7.1
      name: "Where a notified body was involved, name it, describe the procedure and identify the certificate; where none was, say so explicitly"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexV.8
  name: "Annex V (8) — Additional information, and signature with place and date of issue"
  domain: "governance"
  base_score: 8.0
  keywords:
    - additional information
    - signature
    - date of issue
  practices:
    - id: PR.CRA.AnnexV.8.1
      name: "Sign for and on behalf of a named party, and record place and date of issue"
      min_maturity: 2
      gate_relevant: false

# --- Annex I Part I: properties of the product ---------------------------------

- id: CRA.AnnexI.1.1
  name: "Annex I Part I (1) — An appropriate level of cybersecurity based on the risks"
  domain: "technological"
  base_score: 9.5
  keywords:
    - risk based
    - appropriate level
  practices:
    - id: PR.CRA.AnnexI.1.1.1
      name: "Justify the level of security chosen by reference to the documented risk assessment rather than to a fixed baseline"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.1.2a
  name: "Annex I Part I (2)(a) — Placed on the market without known exploitable vulnerabilities"
  domain: "technological"
  base_score: 10.0
  keywords:
    - exploitable
    - known vulnerable
    - release gate
  practices:
    - id: PR.CRA.AnnexI.1.2a.1
      name: "Hold the release when a known exploitable vulnerability is present, and record the decision either way"
      min_maturity: 3
      gate_relevant: true

- id: CRA.AnnexI.1.2b
  name: "Annex I Part I (2)(b) — Secure by default configuration, resettable"
  domain: "technological"
  base_score: 9.0
  keywords:
    - secure by default
    - configuration
    - reset
  practices:
    - id: PR.CRA.AnnexI.1.2b.1
      name: "Ship with a secure configuration as the default, and allow the product to be reset to its original state"
      min_maturity: 3
      gate_relevant: false
    - id: PR.CRA.AnnexI.1.2b.2
      name: "Where a tailor-made product departs from the default, record the agreement with the business user"
      min_maturity: 4
      gate_relevant: false

- id: CRA.AnnexI.1.2c
  name: "Annex I Part I (2)(c) — Vulnerabilities addressable through security updates, including automatic updates by default"
  domain: "technological"
  base_score: 9.0
  keywords:
    - security update
    - automatic update
    - opt-out
  practices:
    - id: PR.CRA.AnnexI.1.2c.1
      name: "Enable automatic security updates by default, with a clear and easy-to-use opt-out"
      min_maturity: 3
      gate_relevant: true
    - id: PR.CRA.AnnexI.1.2c.2
      name: "Notify users of available updates and let them postpone them temporarily"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.1.2d
  name: "Annex I Part I (2)(d) — Protection from unauthorised access, and reporting of such access"
  domain: "technological"
  base_score: 9.5
  keywords:
    - authentication
    - access management
    - unauthorised access
  practices:
    - id: PR.CRA.AnnexI.1.2d.1
      name: "Apply authentication and identity or access management appropriate to the assessed risk"
      min_maturity: 3
      gate_relevant: true

# --- Annex I Part II: vulnerability handling -----------------------------------

- id: CRA.AnnexI.2.1
  name: "Annex I Part II (1) — Identify and document vulnerabilities and the components contained"
