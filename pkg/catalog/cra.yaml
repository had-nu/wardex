    - sbom
  practices:
    - id: PR.CRA.AnnexI.2.1.1
      name: "Keep a component inventory that can be produced on demand"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.2.2
  name: "Annex I Part II (2) — Address and remediate vulnerabilities without delay, proportionate to risk"
