  base_score: 10.0
  keywords:
    - remediation
    - severity
    - patch
  practices:
    - id: PR.CRA.AnnexI.2.2.1
      name: "Set remediation deadlines by severity and follow them, recording an accepted risk where one is missed"
      min_maturity: 3
      gate_relevant: true

- id: CRA.AnnexI.2.3
  name: "Annex I Part II (3) — Effective and regular tests and reviews of product security"
  domain: "process"
  base_score: 8.5
  keywords:
    - security testing
    - review
  practices:
    - id: PR.CRA.AnnexI.2.3.1
      name: "Test and review product security on a cycle defined by the risk assessment"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.2.4
  name: "Annex I Part II (4) — Publicly disclose information about fixed vulnerabilities once fixed"
  domain: "governance"
  base_score: 8.5
  keywords:
    - disclosure
    - advisory
    - fixed
  practices:
    - id: PR.CRA.AnnexI.2.4.1
      name: "Publish an advisory for a fixed vulnerability, not only distribute the update privately"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.2.5
  name: "Annex I Part II (5) — Policy on coordinated vulnerability disclosure, in place and enforced"
  domain: "process"
  base_score: 9.0
  keywords:
    - coordinated vulnerability disclosure
    - cvd
    - contact point
  practices:
    - id: PR.CRA.AnnexI.2.5.1
      name: "Publish and enforce a coordinated vulnerability disclosure policy with a working contact point"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.2.6
  name: "Annex I Part II (6) — Facilitate the sharing of information about potential vulnerabilities"
  domain: "process"
  base_score: 8.0
  keywords:
    - information sharing
    - reporter
  practices:
    - id: PR.CRA.AnnexI.2.6.1
      name: "Make it straightforward for a third party to report a potential vulnerability and to receive an answer"
      min_maturity: 3
      gate_relevant: false

- id: CRA.AnnexI.2.7
  name: "Annex I Part II (7) — Secure mechanisms to distribute updates"
  domain: "technological"
  base_score: 9.5
  keywords:
    - update distribution
    - signing
    - transport security
  practices:
    - id: PR.CRA.AnnexI.2.7.1
      name: "Authenticate and integrity-protect updates so a tampered update cannot be delivered"
      min_maturity: 3
      gate_relevant: true

- id: CRA.AnnexI.2.8
  name: "Annex I Part II (8) — Disseminate security updates without delay"
  domain: "process"
  base_score: 9.0
  keywords:
    - dissemination
    - availability
  practices:
    - id: PR.CRA.AnnexI.2.8.1
      name: "Deliver updates without delay to users who are entitled to them, and reach users who do not auto-update"
      min_maturity: 3
      gate_relevant: false

