      name: "Bind every processing activity to one documented Article 6 basis"
      min_maturity: 2
      gate_relevant: false
    - id: PR.GDPR.6.2
      name: "Record Article 9 conditions where special category data is processed"
      min_maturity: 3
      gate_relevant: false

