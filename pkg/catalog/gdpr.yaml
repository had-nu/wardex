# GDPR control catalogue.
#
# Scope: the obligations an operator can evidence, mapped to the article that
# imposes them. Descriptive text is Wardex's own summary of the article, not a
# quotation from the Regulation.
#
# Art. 3(4) and Art. 4 are definitional and carry no control of their own. The
# Article 33 and 34 deadlines are stated so that a maturity score cannot pass
# for compliance with a deadline that has already passed.

- id: GDPR.5
  name: "Principles relating to processing of personal data"
  domain: "organizational"
  base_score: 9.0
  keywords:
    - accountability
    - data minimisation
    - storage limitation
    - lawfulness
  practices:
    - id: PR.GDPR.5.1
      name: "Record which principle each processing activity relies on, and the reason"
      min_maturity: 2
      gate_relevant: false

- id: GDPR.6
  name: "Lawfulness of processing"
  domain: "organizational"
  base_score: 9.0
  keywords:
    - legal basis
    - consent
    - legitimate interest
    - special category
  practices:
