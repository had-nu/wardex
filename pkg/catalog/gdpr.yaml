- id: GDPR.33
  name: "Notification of a personal data breach to the supervisory authority"
  domain: "process"
  base_score: 9.5
  keywords:
    - breach notification
    - supervisory authority
    - 72 hours
    - pdp
  practices:
    - id: PR.GDPR.33.1
      name: "Notify without undue delay and, where feasible, not later than 72 hours after becoming aware"
      min_maturity: 3
      gate_relevant: false
    - id: PR.GDPR.33.2
      name: "Record the reason any notification was late, or why none was required"
      min_maturity: 3
      gate_relevant: false
    - id: PR.GDPR.33.3
      name: "Document the breach assessment even when the threshold for notification is not met"
      min_maturity: 3
      gate_relevant: false

