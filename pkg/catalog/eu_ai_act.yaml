# EU AI Act control catalogue.
#
# Source:
#   - Regulation (EU) 2024/1689 of the European Parliament and of the Council of
#     13 June 2024 laying down harmonised rules on artificial intelligence
#     (Artificial Intelligence Act), OJ L, 2024/1689, 12.7.2024.
#
# Identifier scheme. "EUAIA.Art<N>" names the article of the Regulation. The title
# after the identifier is the Regulation's own.
#
# Every control sits under the article whose subject it describes, read from the
# text of the Regulation.
#
# Scope. Articles 28 to 47 and 64 to 79 concern notifying authorities, notified
# bodies, the AI Office, the Board and market surveillance. Articles 56, 62 and 71
# bind the AI Office, Member States and the Commission. None of those binds a
# provider or a deployer and none is listed: a catalogue an entity scores itself
# against should not carry obligations that are not its own.
#
# Note: the OJ reference for this Regulation is also the number in its CELEX-style
# filename, which is a coincidence of numbering. The instrument is 2024/1689 and
# not part of the series that includes Regulation (EU) 2024/2847.

