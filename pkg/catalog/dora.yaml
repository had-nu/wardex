# DORA control catalogue.
#
# Source:
#   - Regulation (EU) 2022/2554 of the European Parliament and of the Council of
#     14 December 2022 on digital operational resilience for the financial sector,
#     OJ L 333, 27.12.2022, CELEX 32022R2554.
#
# Identifier scheme. "DORA.Art<N>" names the article of the Regulation. Where one
# article carries more than one distinct obligation, a second control carries
# ".2". The title after the identifier is the Regulation's own.
#
# Every control was placed under the article whose subject it describes, read
# from the text of the Regulation rather than from an outline of the subject
# matter.
#
# Scope. Articles 32 to 44 and 46 to 56 concern the Lead Overseer, supervisory
# authorities and administrative penalties. Those bind authorities rather than a
# financial entity and are not listed: a catalogue an entity scores itself
# against should not carry obligations that are not its own.

