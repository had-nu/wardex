# NIST Cybersecurity Framework catalogue.
#
# Source:
#   - NIST Cybersecurity Framework (CSF) 2.0, NIST CSWP 29, 26 February 2024,
#     DOI 10.6028/NIST.CSWP.29.
#
# Level. This file is at Category level. CSF 2.0 has 6 Functions, 22 Categories
# and 106 Subcategories; Table 1 of the publication carries the 22 Category
# identifiers and their names, and every name below is the one the publication
# gives.
#
# What this replaced. The previous version carried 31 controls, of which nine
# corresponded to no Category in CSF 2.0: DE.DP, DE.MI, ID.GV, ID.SC, PR.AW,
# PR.MA, PR.PM, RS.IM and RS.SC. One real Category was missing, PR.IR,
# Technology Infrastructure Resilience. A report naming DE.MI was naming
# something the Framework does not contain, and the Framework's own resilience
# category was absent.
#
# The mnemonic identifiers are correct: CSF 2.0 does use GV.OC rather than a
# number, and its numbering is deliberately non-sequential where a CSF 1.1
# subcategory moved. Only the set was wrong.


